name: Verify guide
on:
  push:
    branches: [main, 'experimental/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - name: Verify bank answers and validation regressions
        run: |
          python3 content/verify.py
          python3 content/test_verify.py
          python3 content/checkgen.py
          node content/test_runtime.js
      - name: Check programming references and generated files
        run: |
          python3 content/build.py
          python3 content/stamp.py
          git diff --exit-code -- public
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
